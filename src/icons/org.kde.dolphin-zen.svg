<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Folder Back Gradient -->
    <linearGradient id="backGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2a32"/>
      <stop offset="100%" stop-color="#1e1c22"/>
    </linearGradient>

    <!-- Paper Sheet Gradient -->
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8fa"/>
      <stop offset="100%" stop-color="#e4e4e8"/>
    </linearGradient>

    <!-- Folder Front Flap Gradient: Deep warm obsidian -->
    <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34303a"/>
      <stop offset="40%" stop-color="#29262f"/>
      <stop offset="100%" stop-color="#1c1a20"/>
    </linearGradient>

    <!-- Zen Coral Accent Gradient -->
    <linearGradient id="zenCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff866b"/>
      <stop offset="100%" stop-color="#f76f53"/>
    </linearGradient>

    <linearGradient id="topGleam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Clip path to keep Zen circles inside the front flap -->
    <clipPath id="flapClip">
      <path d="m 26.00001,24.00002 -4,4 h -19 v 1 h 0.002 c -5e-5,0.004 -0.002,0.008 -0.002,0.0117 V 56 57 c 0,0.554 0.44599,1 1,1 h 56 c 0.55401,0 1,-0.446 1,-1 v -1 -26.98828 -0.0117 -5 z" />
    </clipPath>
  </defs>

  <!-- Drop Shadow behind folder -->
  <path d="m 26.00001,24.00002 -4,4 h -19 v 1 h 0.002 c -5e-5,0.004 -0.002,0.008 -0.002,0.0117 V 56 57 c 0,0.554 0.44599,1 1,1 h 56 c 0.55401,0 1,-0.446 1,-1 v -1 -26.98828 -0.0117 -5 z" fill="#000000" opacity="0.35" transform="translate(0, 1.5)"/>

  <!-- 1. Folder Back -->
  <path d="m 4,6.00012 v 5 22 c 0,0.55373 0.446,1 1,1 h 54 c 0.55399,0 1,-0.44627 1,-1 V 11.00989 c 0,-0.003 -0.002,-0.006 -0.002,-0.01 H 60 v -1 H 32 l -4,-4 H 4 Z" fill="url(#backGrad)"/>
  <!-- Back Tab Highlight line -->
  <path d="m 28,6 3,5 h 2 27 V 10 H 33 32 Z" fill="#ffffff" opacity="0.12"/>

  <!-- 2. Document Paper Sheet inside folder -->
  <rect x="7" y="14" width="50" height="15" rx="1.5" ry="1.5" fill="url(#paperGrad)"/>
  <!-- Paper subtle header lines (file structure impression) -->
  <rect x="11" y="17" width="14" height="1.5" rx="0.75" fill="#f76f53" opacity="0.6"/>
  <rect x="11" y="21" width="26" height="1.2" rx="0.6" fill="#888896" opacity="0.35"/>

  <!-- 3. Folder Front Flap -->
  <path d="m 26.00001,24.00002 -4,4 h -19 v 1 h 0.002 c -5e-5,0.004 -0.002,0.008 -0.002,0.0117 V 56 57 c 0,0.554 0.44599,1 1,1 h 56 c 0.55401,0 1,-0.446 1,-1 v -1 -26.98828 -0.0117 -5 z" fill="url(#flapGrad)"/>
  <!-- Flap top 1px edge highlight -->
  <path d="m 26.00001,24.00002 -4,4 h -19 v 1 h 0.002 c -5e-5,0.004 -0.002,0.008 -0.002,0.0117 V 56 57 c 0,0.554 0.44599,1 1,1 h 56 c 0.55401,0 1,-0.446 1,-1 v -1 -26.98828 -0.0117 -5 z" fill="url(#topGleam)"/>

  <!-- 4. Zen Circles (Clipped into flap, offset to bottom-right, dynamic size) -->
  <g clip-path="url(#flapClip)">
    <!-- Subtle warm glow background behind the circles -->
    <circle cx="39" cy="43" r="24" fill="#f76f53" opacity="0.08"/>
    
    <!-- Outer Zen Ring -->
    <circle cx="39" cy="43" r="19" fill="none" stroke="url(#zenCoral)" stroke-width="2.6" opacity="0.9"/>
    
    <!-- Middle Zen Ring -->
    <circle cx="39" cy="43" r="12" fill="none" stroke="url(#zenCoral)" stroke-width="2.2" opacity="0.95"/>
    
    <!-- Inner Zen Core -->
    <circle cx="39" cy="43" r="5.5" fill="url(#zenCoral)" opacity="1.0"/>
  </g>

  <!-- Flap bottom bevel line -->
  <path d="m 4,58 c -0.554,0 -1,-0.446 -1,-1 v -0.5 c 0,0.554 0.446,1 1,1 h 56 c 0.554,0 1,-0.446 1,-1 V 58 c 0,0.554 -0.446,1 -1,1 Z" fill="#000000" opacity="0.5"/>
</svg>