name: Interface Contract & Upstream Compatibility Test

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run every Monday at 03:00 UTC to catch any breaking upstream changes early
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-contract:
    name: Build & Run zenhostinterfacetest
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ git python3 extra-cmake-modules \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            kf6-kio-devel kf6-kbookmarks-devel kf6-kitemmodels-devel \
            kf6-kcoreaddons-devel kf6-kconfig-devel kf6-knotifications-devel \
            kf6-ktextwidgets-devel kf6-kcmutils-devel kf6-kcrash-devel \
            kf6-kdbusaddons-devel kf6-kdoctools-devel kf6-ki18n-devel \
            kf6-kiconthemes-devel kf6-solid-devel kf6-kparts-devel \
            kf6-kirigami-devel kf6-kfilemetadata-devel kf6-baloo-devel \
            kf6-knewstuff-devel kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel \
            kf6-kcodecs-devel kf6-kguiaddons-devel kf6-kcolorscheme-devel \
            kf6-kxmlgui-devel kf6-kcompletion-devel \
            kf6-kuserfeedback-devel baloo-widgets-devel phonon-qt6-devel

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build zenhostinterfacetest
        run: |
          cmake --build build --target zenhostinterfacetest -j$(nproc)

      - name: Run Interface Contract Test
        run: |
          ctest --test-dir build -R zenhostinterfacetest --output-on-failure

  upstream-sync:
    name: Upstream Dolphin Sync & PR (Option B)
    needs: test-contract
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cmake ninja-build gcc-c++ git python3 gh extra-cmake-modules \
            qt6-qtbase-devel qt6-qtbase-private-devel qt6-qtdeclarative-devel qt6-qtmultimedia-devel \
            kf6-kio-devel kf6-kbookmarks-devel kf6-kitemmodels-devel \
            kf6-kcoreaddons-devel kf6-kconfig-devel kf6-knotifications-devel \
            kf6-ktextwidgets-devel kf6-kcmutils-devel kf6-kcrash-devel \
            kf6-kdbusaddons-devel kf6-kdoctools-devel kf6-ki18n-devel \
            kf6-kiconthemes-devel kf6-solid-devel kf6-kparts-devel \
            kf6-kirigami-devel kf6-kfilemetadata-devel kf6-baloo-devel \
            kf6-knewstuff-devel kf6-kwidgetsaddons-devel kf6-kwindowsystem-devel \
            kf6-kcodecs-devel kf6-kguiaddons-devel kf6-kcolorscheme-devel \
            kf6-kxmlgui-devel kf6-kcompletion-devel \
            kf6-kuserfeedback-devel baloo-widgets-devel phonon-qt6-devel

      - name: Check and merge latest Upstream Dolphin release tag
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://invent.kde.org/system/dolphin.git || true
          git fetch upstream --tags

          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          echo "Latest upstream Dolphin tag: $LATEST_TAG"

          if git merge-base --is-ancestor "$LATEST_TAG" HEAD; then
            echo "Already up to date with $LATEST_TAG."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -b "upstream-sync/$LATEST_TAG"
          git merge --no-edit "$LATEST_TAG"

          python3 - << 'EOF'
          import re, json
          with open("CMakeLists.txt", "r", encoding="utf-8") as f:
              cmake = f.read()
          maj = re.search(r'set\s*\(RELEASE_SERVICE_VERSION_MAJOR\s+"(\d+)"\)', cmake).group(1)
          min_v = re.search(r'set\s*\(RELEASE_SERVICE_VERSION_MINOR\s+"(\d+)"\)', cmake).group(1)
          mic = re.search(r'set\s*\(RELEASE_SERVICE_VERSION_MICRO\s+"(\d+)"\)', cmake).group(1)
          ver = f"v{maj}.{min_v}.{mic}"

          with open("org.kde.dolphin-zen.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)
          changed = False
          for mod in manifest.get("modules", []):
              if mod.get("name") == "baloo-widgets":
                  for src in mod.get("sources", []):
                      if src.get("tag") != ver:
                          src["tag"] = ver
                          changed = True
          if changed:
              with open("org.kde.dolphin-zen.json", "w", encoding="utf-8") as f:
                  json.dump(manifest, f, indent=4)
                  f.write("\n")
          EOF

          git add org.kde.dolphin-zen.json
          git diff --cached --quiet || git commit -m "chore(flatpak): bump baloo-widgets to $LATEST_TAG"

          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Verify Contract Test after Upstream Merge
        if: steps.sync.outputs.updated == 'true'
        run: |
          cmake -B build-sync -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sync --target zenhostinterfacetest -j$(nproc)
          ctest --test-dir build-sync -R zenhostinterfacetest --output-on-failure

      - name: Push Sync Branch & Open Pull Request
        if: steps.sync.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.sync.outputs.tag }}"
          BRANCH="upstream-sync/$TAG"
          git push --force origin "$BRANCH"
          gh pr create \
            --title "chore(upstream): sync with upstream Dolphin $TAG" \
            --body "Automated upstream sync with official KDE Dolphin release \`$TAG\`. \`zenhostinterfacetest\` passed and \`org.kde.dolphin-zen.json\` has been updated automatically." \
            --head "$BRANCH" || true

